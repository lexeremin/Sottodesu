name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          xcodebuild test \
            -project Sottodesu.xcodeproj \
            -scheme Sottodesu \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            -quiet
