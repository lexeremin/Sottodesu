name: Sottodesu
options:
  bundleIdPrefix: dev.sottodesu
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
targets:
  Sottodesu:
    type: application
    platform: macOS
    sources:
      - Sottodesu
      # The background agent's description goes inside the app, where macOS looks for it.
      - path: Agent/dev.sottodesu.app.scheduler.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: GRDB
    info:
      path: Sottodesu/Info.plist
      properties:
        CFBundleDisplayName: Sottodesu
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, zh-Hans, ko, ja, fr]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSDownloadsFolderUsageDescription: Sottodesu sorts the files in your Downloads folder into subfolders by type.
        NSDesktopFolderUsageDescription: If you choose to, Sottodesu sorts the files on your Desktop into subfolders by type.
        NSDocumentsFolderUsageDescription: When you sort your home folder, Sottodesu moves loose documents into your Documents folder.
        NSRemovableVolumesUsageDescription: If you choose a folder on an external drive, Sottodesu can sort it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sottodesu.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SottodesuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SottodesuTests
    dependencies:
      - target: Sottodesu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sottodesu.tests
        GENERATE_INFOPLIST_FILE: YES
